# Временный служебный workflow: перенос DATABASE_URL в соседние репозитории
# и проверка общей базы заявок. Удаляется сразу после использования.
name: ops-leads (temporary)

on:
  workflow_dispatch:
    inputs:
      action:
        description: export-db-url | check | cleanup-tests
        required: true
        type: choice
        options: [export-db-url, check, cleanup-tests]
      pubkey:
        description: base64 публичного RSA-ключа (только для export-db-url)
        required: false

jobs:
  export:
    if: inputs.action == 'export-db-url'
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt DATABASE_URL with one-time public key
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUBKEY: ${{ inputs.pubkey }}
        run: |
          echo "$PUBKEY" | base64 -d > pub.pem
          printf %s "$DATABASE_URL" \
            | openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            | base64 -w0 > enc.txt
          echo "ENC:$(cat enc.txt)"

  db:
    if: inputs.action != 'export-db-url'
    runs-on: ubuntu-latest
    steps:
      - name: Query shared leads database
        uses: appleboy/ssh-action@v1.0.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ACTION: ${{ inputs.action }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DATABASE_URL,ACTION
          script: |
            if [ "$ACTION" = "cleanup-tests" ]; then
              SQL="DELETE FROM site_leads WHERE name LIKE 'ТЕСТ Claude%' RETURNING id, site; DELETE FROM site_messages WHERE subject LIKE 'ТЕСТ Claude%' RETURNING id, site;"
            else
              SQL="SELECT site, count(*) AS total, count(telegram_sent_at) AS sent_to_tg FROM site_leads GROUP BY site ORDER BY site;
              SELECT id, created_at AT TIME ZONE 'Europe/Moscow', site, form, name, utm_source, utm_campaign, ym_client_id IS NOT NULL AS has_clientid, telegram_sent_at IS NOT NULL AS sent FROM site_leads WHERE name LIKE 'ТЕСТ Claude%' ORDER BY id;
              SELECT site, source, count(*) FROM site_messages GROUP BY site, source ORDER BY site, source;
              SELECT id, site, source, type, subject FROM site_messages WHERE subject LIKE 'ТЕСТ Claude%' ORDER BY id;"
            fi
            docker ps --format '{{.Names}} {{.Networks}}' | grep -E 'pixeltool|gooselabs|portfolio|postgres' || true
            docker run --rm --network pixeltool-net -e DATABASE_URL postgres:16-alpine \
              psql "$DATABASE_URL" -P pager=off -c "$SQL"
