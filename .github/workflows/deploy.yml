name: Deploy to Production

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      env:
        REGISTRY: ${{ env.REGISTRY }}
        IMAGE_NAME: ${{ env.IMAGE_NAME }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${{ secrets.NEXT_PUBLIC_YANDEX_METRIKA_ID }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        SMTP_FROM: ${{ secrets.SMTP_FROM }}
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        envs: REGISTRY,IMAGE_NAME,DATABASE_URL,NEXT_PUBLIC_YANDEX_METRIKA_ID,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASSWORD,SMTP_FROM
        script: |
          mkdir -p ~/pixeltool
          cd ~/pixeltool

          # .env.production перезаписывается на КАЖДОМ деплое — раньше файл
          # создавался только "если не существует", поэтому один раз записанные
          # (сломанные) значения оставались навсегда даже после исправления
          # секретов. Heredoc-делимитер БЕЗ кавычек (не 'ENVEOF') — только так
          # bash подставляет ${DATABASE_URL} и остальные переменные вместо того,
          # чтобы записать их в файл буквально как текст "${DATABASE_URL}".
          cat > .env.production << ENVEOF
          # Production environment variables
          DATABASE_URL=${DATABASE_URL}
          NEXT_PUBLIC_YANDEX_METRIKA_ID=${NEXT_PUBLIC_YANDEX_METRIKA_ID}
          SMTP_HOST=${SMTP_HOST}
          SMTP_PORT=${SMTP_PORT}
          SMTP_USER=${SMTP_USER}
          SMTP_PASSWORD=${SMTP_PASSWORD}
          SMTP_FROM=${SMTP_FROM}
          NEXT_PUBLIC_SITE_URL=https://pixeltool.pro
          NODE_ENV=production
          PORT=3000
          HOSTNAME=0.0.0.0
          ENVEOF

          # Сеть с БД (pixeltool-net) создана вручную на сервере — держим
          # создание идемпотентным здесь на случай пересоздания сервера.
          docker network create pixeltool-net 2>/dev/null || true

          # Pull latest image
          docker pull ${REGISTRY}/${IMAGE_NAME}:latest

          # Stop existing container
          docker stop pixeltool || true
          docker rm pixeltool || true

          # Start new container
          docker run -d \
            --name pixeltool \
            --restart unless-stopped \
            --network pixeltool-net \
            --env-file ~/pixeltool/.env.production \
            -p 3000:3000 \
            ${REGISTRY}/${IMAGE_NAME}:latest
          
          # Check if container is running
          if docker ps | grep -q pixeltool; then
            echo "Deployment successful! Container is running."
            docker logs pixeltool --tail 50
          else
            echo "Deployment failed! Container is not running."
            docker logs pixeltool
            exit 1
          fi
